# tlDR Engine — documentation site
#
#   pip install mkdocs-material
#   mkdocs serve      # preview at http://127.0.0.1:8000
#   mkdocs build      # static site in ./site
#
# If you would rather not install Material, change `theme.name` to `readthedocs`
# and delete the `palette`/`features` keys below.

site_name: tlDR Engine Handbook
site_description: A practical guide to building a DELTARUNE-style game with the tlDR Engine.
site_url: https://profsergiocosta.github.io/tldr-engine/
repo_url: https://github.com/profsergiocosta/tldr-engine
repo_name: profsergiocosta/tldr-engine
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Fonts and accents: getting-started/fonts-and-accents.md
  - Overworld:
      - Rooms and collision: overworld/rooms-and-collision.md
      - NPCs and dialogue: overworld/npcs-and-dialogue.md
      - Tiles and tilesets: overworld/tiles-and-tilesets.md
  - Battle system:
      - How a fight works: battle-system/overview.md
      - Your first enemy: battle-system/your-first-enemy.md
      - The arena: battle-system/the-arena.md
      - Advanced patterns: battle-system/advanced-patterns.md
  - Reference:
      - enemy(): reference/enemy-struct.md
      - enc_set(): reference/enc-set.md
      - turn_object: reference/turn-object.md

  # Earlier drafts, written in Portuguese. Kept for reference; move or delete
  # this section freely — nothing in the English book links to it.
  # Any other .md left loose in docs/ (the "(copy)" files, for instance) will
  # simply show up as an "is not included in the nav" notice when you build.
  - Notas em português:
      - Guia da engine: tldr-engine-guia.md
      - Como criar batalhas: tutorial-batalhas.md
      - Como funciona uma luta: tutorial-luta.md
      - Primeiro inimigo: tutorial-primeiro-inimigo.md
      - A arena: tutorial-arena.md
